name: Deploy React App to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Verify Build
        run: ls -la dist/

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 77.37.34.104
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./domains/custommechanicsltd.com/public_html/
          
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp   

      - name: Verify FTP Destination
        run: |
          lftp -c "
          set ssl:verify-certificate no
          open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ftp://77.37.34.104
          cd domains/custommechanicsltd.com/public_html
          pwd
          ls -la
          bye
          "

      